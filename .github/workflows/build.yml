name: Build Firmware

on:
  push:
    branches: 
      - github
      - esp32/*
  pull_request:
    branches: [ github ]

jobs:
  build:
    if: github.ref == 'refs/heads/github'
    runs-on: ubuntu-latest
    env:
      lang: pl
    
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-env   # common steps : cache + Python + PlatformIO

    - name: Debug PlatformIO
      run: |
        pio system info
        pio pkg list

    - name: Build firmware variants
      run: |
        # recreate build dirs
        mkdir -p builds/esp8266

        echo "Building ESP8266 $lang variant..."
        pio run -e "lang_$lang"

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # Beta builds
          cp .pio/build/lang_$lang/firmware.bin builds/esp8266/firmware-esp8266-$lang-beta.bin
        else
          # Alfa builds
          cp .pio/build/lang_$lang/firmware.bin builds/esp8266/firmware-esp8266-$lang-alfa.bin
        fi

    - name: Create or Update Tag
      run: |
        git tag -f latest

    - name: Debug github.ref
      run: echo "ESP8266 from ${{ github.ref }}"

    - name: Delete old release/tag
      uses: dev-drprasad/delete-tag-and-release@v0.2.1
      with:
        tag_name: latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        files: |
          builds/esp8266/firmware-esp8266-*.bin
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-esp32-draft:
    if: startsWith(github.ref, 'refs/heads/esp32/')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-env   # again same setup
    - name: Build ESP32 firmware (draft)
      run: |
        mkdir -p builds/esp32
        echo "Building ESP32 test firmware..."
        pio run -e "lang_en_32"
        cp .pio/build/lang_en_32/firmware.bin builds/esp32/firmware-esp32-test.bin
        cp .pio/build/lang_en_32/firmware.elf builds/esp32/firmware-esp32-test.elf

    - name: Debug github.ref
      run: echo "ESP32 from ${{ github.ref }}"

      - name: Delete old test release/tag
      uses: dev-drprasad/delete-tag-and-release@v0.2.1
      with:
        tag_name: esp32_test
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Draft Release for ESP32 test
      uses: softprops/action-gh-release@v1
      with:
        tag_name: esp32_test
        name: "Non public, ESP32 version"
        body: "Hidden as I can not test it."
        files: |
          builds/esp32/firmware-esp32-test.bin
          builds/esp32/firmware-esp32-test.elf
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
