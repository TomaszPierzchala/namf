name: Build and Deploy Firmware

on:
  push:
    branches: 
      - esp8266/*
  #pull_request:
  #  branches: [ github ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      lang: pl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e "lang_$lang"

      - name: Copy firmware
        run: |
          mkdir -p public
          cp .pio/build/lang_$lang/firmware.bin public/firmware-esp8266-$lang.bin

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true 
